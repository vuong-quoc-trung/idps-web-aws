name: Student Web CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'student-web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'student-web/**'
      - '.github/workflows/ci.yml'

jobs:
  # ========================================================
  # Job 1: Student Web - Frontend (React 19 + TypeScript)
  # ========================================================
  student-web-frontend:
    name: "Student Web - Frontend (React/Vite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-web/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: student-web/frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check (TypeScript) & Build Vite bundle
        run: npm run build

  # ========================================================
  # Job 2: Student Web - Backend (Spring Boot + Java 25)
  # ========================================================
  student-web-backend:
    name: "Student Web - Backend (Spring Boot/Java)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/migration_test
      MIGRATION_TEST_USER: postgres
      MIGRATION_TEST_PASSWORD: migration-test-only
    defaults:
      run:
        working-directory: student-web/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      # H2 application tests plus PostgreSQL migrations, transactions, locks and token races
      - name: Run backend tests including PostgreSQL concurrency
        run: ./mvnw test

      # Đóng gói file JAR ứng dụng Spring Boot
      - name: Build production JAR
        run: ./mvnw clean package -DskipTests
