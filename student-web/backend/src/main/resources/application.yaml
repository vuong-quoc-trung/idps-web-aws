spring:
  application:
    name: student-web
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
