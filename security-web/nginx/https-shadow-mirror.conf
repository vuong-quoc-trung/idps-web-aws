    location = /_idps_https_projection {
        internal;
        access_log off;
        error_log /dev/null crit;
        if ($r35_api = 0) { return 204; }
        set $args "";
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header X-IDPS-Request-Id $r35_id;
        proxy_set_header X-IDPS-Method $r35_method;
        proxy_set_header X-IDPS-Target $r35_target;
        proxy_set_header X-IDPS-Dispatch $r35_dispatch;
        proxy_connect_timeout 100ms;
        proxy_read_timeout 1s;
        proxy_send_timeout 100ms;
        proxy_next_upstream off;
        proxy_pass http://unix:__SOCKET__:/project;
    }
