independent_label_evidence_contract:
  version: 2
  implementation: src/idps_ai/data/label_evidence.py
  audit_command: scripts/audit-label-evidence.py
  required_per_approved_request:
  - capture artifact SHA256 and event key
  - intent provenance artifact SHA256 and event key
  - independent semantic-review artifact SHA256, distinct from raw capture
  separate_fields:
  - 'intent: benign/attack/unknown'
  - 'attack_family: known supported family or null'
  - 'exploit_outcome: unknown/succeeded/failed/not_applicable'
  independence: Collector and independent human reviewer identifiers distinct; actual human identity/semantic
    reliability must be verified externally. Hash integrity does not certify truth.
  unknown_policy: Pending/rejected/unknown has null label; no status/rule/model/time proximity inference.
    Existing approved dataset label must match evidence, no silent relabel. Resolve unknown through explicit
    review and a new immutable labeled dataset/provenance chain before admission.
  outcome_policy: Attack remains positive if exploit fails. Succeeded/failed needs application-oracle
    evidence, not response status alone.
  heldout_policy: Review or evidence paths under sealed markers fail closed. Do not open any of148WCP
    reserved case files.
generalization_acceptance_requirements:
  status: NOT_READY
  purpose: Prerequisites for a preregistered balanced acceptance experiment; not production certification
  data:
  - Approved use and source/capture provenance verified
  - Request-bound independent intent evidence and visibility audit, unknown excluded from supervised loss
  - Distinct request observations, representations and training admission reported separately
  - At least two eligible dual-class sources in research fitting, no source-label confounding by benign-only
    admission
  - Independent benign/attack campaign and environment assessment registered before scores, final holdouts
    unchanged
  - No cross-role request/campaign/template leak; report view collisions without deleting future hard
    cases
  - Actual chronology and receipt-order required for behavior; no invented clock or future flow context
  comparison:
  - Same feature visibility, fitting data, random-seed protocol, calibration data and FPR budget for MLP/GLU/baselines
  - Threshold and model selection from allowed calibration/development only; freeze before new acceptance
    data
  - Precision/Recall/F1/FPR/AP by source/campaign/family, fixed-threshold score/calibration distributions
  - Cluster-aware uncertainty, adequate benign and attack counts; benign-only metrics cannot establish
    recall
  - Measured model and end-to-end latency reported separately; ONNX tolerances and exact resume retained
  formal_gate: Existing scale policy remains closed (0 admitted requests); independent balanced acceptance
    not collected, no formal command, champion or live blocking.
