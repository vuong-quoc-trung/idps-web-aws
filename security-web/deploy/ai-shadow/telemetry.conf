# http context. Omit query; redact selected sensitive path/header patterns.
map $uri $pbl4_ai_api { default 0; ~^/api/ 1; }
map $uri $pbl4_ai_url {
    default $uri;
    "~*(?:;|%3b)jsessionid|(?:token|password|passwd|secret|api[_-]?key|authorization|code)(?:=|%3d)|/auth/|/(?:token|tokens|activate|reset-password)/" /api/redacted;
}
map $http_user_agent $pbl4_ai_ua {
    default $http_user_agent;
    "~*(?:bearer[[:space:]]|(?:token|password|secret|api[_-]?key)[[:space:]]*[:=]|eyJ[A-Za-z0-9_-]+\.)" "[REDACTED]";
}
map $http_accept $pbl4_ai_accept {
    default $http_accept;
    "~*(?:bearer[[:space:]]|(?:token|password|secret|api[_-]?key)[[:space:]]*[:=]|eyJ[A-Za-z0-9_-]+\.)" "[REDACTED]";
}
map $http_content_type $pbl4_ai_content_type {
    default $http_content_type;
    "~*(?:bearer[[:space:]]|(?:token|password|secret|api[_-]?key)[[:space:]]*[:=]|eyJ[A-Za-z0-9_-]+\.)" "[REDACTED]";
}
log_format pbl4_ai_telemetry escape=json
    '{"schema_version":"nginx-ai-1","request_id":"$request_id",'
    '"timestamp":"$time_iso8601","method":"$request_method","url":"$pbl4_ai_url",'
    '"headers":{"User-Agent":"$pbl4_ai_ua","Accept":"$pbl4_ai_accept","Content-Type":"$pbl4_ai_content_type"}}';
