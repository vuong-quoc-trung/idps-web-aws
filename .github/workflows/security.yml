name: Security Platform CI
on:
  push:
    paths: ['security-web/**', '.github/workflows/security.yml']
  pull_request:
    paths: ['security-web/**', '.github/workflows/security.yml']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: security-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:security-ci-only@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: security-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: security-web/frontend/package-lock.json
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: npm ci
        working-directory: security-web/frontend
      - run: npm run build
        working-directory: security-web/frontend
      - run: bash -n scripts/deploy.sh scripts/pbl4-firewall
