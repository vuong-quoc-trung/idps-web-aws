  application_behavior_strata:
  - browser catalog/search/cart with matched query hard negatives
  - documentation/code search with legitimate hostile-looking syntax
  - structured API read/mutation/auth sessions with observed outcomes
  campaign_registration: Freeze source/environment/campaign/time/seed and payload-template
    groups before requests, collect publisher/runner evidence separately from model
    features
  temporal_roles:
  - train
  - calibration
  - development_validation
  - sealed_final
  embargo_seconds: 300
  behavior_windows_seconds:
  - 10
  - 60
  - 300
  require_actual_clock_and_receipt_order_for_behavior: true
  missing_clock_or_flow: Keep unavailable; never synthesize from array index or pretend
    public requests are three-source events
  label_review: Unknown stays unknown; independent reviewer/evidence/hash-bound attestation
    required. No 200/no-alert/nonmatch-to-benign, no model-prediction labels. Controlled
    intent is not exploit-success ground truth.
  curation: Fit-side duplicate/conflict rules frozen before evaluation; do not filter
    final heldout errors using future labels. Preserve every exclusion reason and
    unfiltered sensitivity.
  cross_source_lineage: Audit site/application/campaign/template/raw-signature and
    actual encoded-vector overlap; correlated websites/day blocks are not independent
    attacks
  models: Keep MLP and GLU frozen controls; short hypothesis study only with eligible
    fitting data and untouched validation; no automatic champion or blocking
  acceptance: Precision/Recall/FPR/AP/family and latency plus cluster uncertainty;
    benign-only public supplement cannot establish recall or select champion

