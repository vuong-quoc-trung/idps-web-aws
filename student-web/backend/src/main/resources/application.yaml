spring:
  application:
    name: student-web
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/student_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "1"
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true

server:
  address: ${STUDENT_BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: NONE
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  security:
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1/32,::1/128}
  audit:
    include-successful-reads: ${AUDIT_INCLUDE_SUCCESSFUL_READS:true}
    source-instance: ${STUDENT_SOURCE_INSTANCE:student-web}
    file:
      enabled: ${STUDENT_AUDIT_LOG_ENABLED:true}
      path: ${STUDENT_AUDIT_LOG_PATH:./logs/student-audit.log}
      hmac-key: ${STUDENT_AUDIT_HMAC_KEY:}
      max-bytes: ${STUDENT_AUDIT_MAX_BYTES:67108864}
    retention:
      enabled: ${AUDIT_RETENTION_ENABLED:true}
      initial-delay-ms: 60000
      interval-ms: 600000
  activation:
    public-base-url: ${PUBLIC_APP_URL:http://localhost:5173}
  password-reset:
    mail-enabled: ${PASSWORD_RESET_MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
