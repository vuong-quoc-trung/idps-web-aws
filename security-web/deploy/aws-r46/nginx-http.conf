# Install as the only active R46 gateway config, inside NGINX's http context.
log_format r46_staging '$time_iso8601 $server_name $request_method $status $request_time';

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    return 421;
}

server {
    listen 80;
    server_name student-dut.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/websentinel-staging-access.log r46_staging;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/websentinel/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        default_type text/plain;
        return 200 "STUDENT DUT — AWS STAGING\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name websentinal.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/websentinel-staging-access.log r46_staging;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/websentinel/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        default_type text/plain;
        return 200 "WEBSENTINAL — AWS STAGING\n";
    }

    location / {
        return 404;
    }
}
