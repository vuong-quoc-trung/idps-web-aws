derived_dataset:
  identity: purpose-separated HMAC keys; raw IP/user/session/request values are never
    stored
  time: UTC Unix seconds float64 at microsecond precision
  uri_path: safe route template
  numeric_json: finite numeric structure only, no query text
  flow_json: finite numeric same-flow context only
  label_source:
  - scenario_manifest
  - human_review
  - weak_rule
  - unknown
  unknown_labels: never train, never auto-benign
  inputs_are_read_only: true
