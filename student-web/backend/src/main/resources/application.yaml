spring:
  application:
    name: student-web
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
