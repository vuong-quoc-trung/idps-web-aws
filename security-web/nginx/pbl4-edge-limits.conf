# HTTP context. Lab starting limits; tune using legitimate traffic measurements.
# Use the actual peer IP, never an untrusted forwarded header.
limit_req_zone $binary_remote_addr zone=pbl4_requests:10m rate=20r/s;
map "$request_method:$uri" $pbl4_auth_limit_key {
    default "";
    ~^POST:/api/auth/(login|activate|activation/(verify|send)|forgot-password|reset-password|change-password)$ "$binary_remote_addr:$uri";
}
limit_req_zone $pbl4_auth_limit_key zone=pbl4_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=pbl4_connections:10m;
