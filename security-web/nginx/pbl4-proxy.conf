# Host -> Web VM template. Render with scripts/prepare-nginx-host.py.
# HTTP-context formats are installed separately in conf.d/pbl4-ai-shadow.conf.
server {
    # PBL4 MANAGED HOST V1
    listen 192.168.10.1:80;
    # OPTIONAL_LAN_LISTENER
    server_name _;
    # PBL4 AI SHADOW HOST BEGIN
    access_log syslog:server=unix:/run/pbl4-ai-shadow/nginx.sock,tag=ai_shadow,nohostname pbl4_ai_telemetry if=$pbl4_ai_api;
    add_header X-Request-Id $request_id always;
    # PBL4 AI SHADOW HOST END
    access_log /var/log/nginx/access.log pbl4_ai_access;
    # NGINX error messages can contain raw request/query; retain privacy policy.
    error_log /dev/null crit;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Forwarded "";
    proxy_hide_header X-Request-Id;
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    location ~* ^/(?:\.env(?:[./]|$)|\.git/|actuator/(?:env|heapdump)(?:/|$)) { return 403; }
    location / {
        proxy_pass http://192.168.20.10:80;
    }
}
