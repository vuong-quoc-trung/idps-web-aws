# Dedicated process; lab RELP/TCP, NO TLS yet. Firewall guard required before start.
global(workDirectory="/var/lib/pbl4-audit-receiver" maxMessageSize="64k"
       parser.escapeControlCharactersOnReceive="off")
module(load="imrelp")
module(load="mmjsonparse")
# RELP transports raw JSON, not a syslog envelope. Keep rawmsg, not parsed msg.
template(name="AuditLine" type="string" string="%rawmsg%\n")
ruleset(name="student_only" queue.type="Disk" queue.filename="student-receive"
        queue.maxDiskSpace="1g" queue.maxFileSize="16m"
        queue.checkpointInterval="1" queue.syncQueueFiles="on"
        queue.saveOnShutdown="on" queue.timeoutEnqueue="-1") {
    if ($fromhost-ip != "192.168.20.10") then { stop }
    action(type="mmjsonparse" cookie="" useRawMsg="on")
    if ($parsesuccess != "OK") then { stop }
    if ($!source != "STUDENT_AUDIT" or $!schema_version != "1.0") then { stop }
    action(type="omfile" file="/var/log/pbl4/student-audit.log" template="AuditLine"
           fileCreateMode="0640" dirCreateMode="0750" sync="on"
           action.resumeRetryCount="-1" action.resumeInterval="5")
    stop
}
input(type="imrelp" address="192.168.20.1" port="2514" maxDataSize="65536"
      ruleset="student_only")
