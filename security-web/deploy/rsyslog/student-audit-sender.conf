# Dedicated process; never include /etc/rsyslog.conf. Lab RELP is NOT encrypted.
global(workDirectory="/var/lib/pbl4-audit-sender" maxMessageSize="64k"
       parser.escapeControlCharactersOnReceive="off")
module(load="imfile")
module(load="omrelp")
template(name="AuditRaw" type="string" string="%msg%")
ruleset(name="student_only"
        queue.type="Disk" queue.filename="student-forward"
        queue.maxDiskSpace="1g" queue.maxFileSize="16m"
        queue.checkpointInterval="1" queue.syncQueueFiles="on"
        queue.saveOnShutdown="on" queue.timeoutEnqueue="-1"
        queue.dequeueBatchSize="1" queue.timeoutShutdown="1000"
        queue.timeoutActionCompletion="10000") {
    action(type="omrelp" target="192.168.20.1" port="2514" template="AuditRaw"
           timeout="5" conn.timeout="5"
           action.resumeRetryCount="-1" action.resumeInterval="5")
    stop
}
# Include only this producer's uncompressed generations, for restart during rotation.
input(type="imfile" File="/home/khang1901/idps-web-aws/student-web/backend/logs/student-audit.log*"
      Tag="pbl4-student" Ruleset="student_only" PersistStateInterval="1"
      freshStartTail="off" reopenOnTruncate="on" addMetadata="off")
