# Replace nginx-http.conf only after the combined Certbot lineage exists.
log_format r46_staging '$time_iso8601 $server_name $request_method $status $request_time';

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    server_tokens off;
    return 421;
}

server {
    listen 80;
    server_name student-dut.duckdns.org websentinal.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/websentinel-staging-access.log r46_staging;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/websentinel/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # This server accepts only the two configured names.
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log off;
    server_tokens off;
    return 421;
}

server {
    listen 443 ssl;
    server_name student-dut.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/websentinel-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websentinel-staging/privkey.pem;
    server_tokens off;
    access_log /var/log/nginx/websentinel-staging-access.log r46_staging;

    if ($ssl_server_name != $host) {
        return 421;
    }
    charset utf-8;

    location = / {
        default_type text/plain;
        return 200 "STUDENT DUT — AWS STAGING\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name websentinal.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/websentinel-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websentinel-staging/privkey.pem;
    server_tokens off;
    access_log /var/log/nginx/websentinel-staging-access.log r46_staging;

    if ($ssl_server_name != $host) {
        return 421;
    }
    charset utf-8;

    location = / {
        default_type text/plain;
        return 200 "WEBSENTINAL — AWS STAGING\n";
    }

    location / {
        return 404;
    }
}
