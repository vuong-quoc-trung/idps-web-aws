[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idps-ai-training"
version = "0.1.0"
description = "Isolated read-only AI-IDPS data, causal features, CPU training and ONNX verification"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.5.4", "pyarrow==26.0.0", "scikit-learn==1.9.1", "onnx==1.23.2", "onnxruntime==1.31.1", "psutil==7.2.2", "PyYAML==6.0.3", "jsonschema==4.26.0", "threadpoolctl==3.7.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.3"]

[project.scripts]
idps-ai = "idps_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
