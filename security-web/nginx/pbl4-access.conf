# Include this file from the nginx http context (e.g. sites-enabled).
# Inspect URI/query in memory; persist only category flags, never raw arguments.
# These flags are hard-rule observations, not model inputs or attack ground truth.
map "$uri?$args" $pbl4_host_sqli {
    default 0;
    "~*(?:union(?:[+[:space:]]|%20|%09|/\\*.*?\\*/)+(?:all(?:[+[:space:]]|%20|%09|/\\*.*?\\*/)+)?select|(?:\\x27|%27|\\x22|%22)(?:[+[:space:]]|%20|%09|/\\*.*?\\*/)*(?:or|and)(?:[+[:space:]]|%20|%09|/\\*.*?\\*/)+(?:[0-9]+|\\x27|%27|\\x22|%22)|(?:sleep|benchmark|pg_sleep|extractvalue|updatexml)(?:[+[:space:]]|%20|%09)*(?:\\(|%28)|waitfor(?:[+[:space:]]|%20|%09)+delay)" 1;
}
map "$uri?$args" $pbl4_host_xss {
    default 0;
    "~*(?:(?:<|%3c)(?:script|svg|iframe|img)|javascript(?:[:]|%3a)|(?:onerror|onload|onmouseover)(?:[+[:space:]]|%20|%09)*(?:=|%3d))" 1;
}
map "$uri?$args" $pbl4_host_traversal {
    default 0;
    "~*(?:(?:\\.\\.|%2e%2e|%252e%252e)(?:/|%2f|%252f|\\x5c|%5c)|(?:/|%2f)etc(?:/|%2f)(?:passwd|shadow)|php(?:[:]|%3a)(?://|%2f%2f)(?:filter|input))" 1;
}
map "$uri?$args" $pbl4_host_command {
    default 0;
    "~*(?:[;&|`]|%3b|%26|%7c|%60|\\$\\(|%24%28)(?:[+[:space:]]|%20|%09)*(?:cat|id|whoami|uname|nc|sh|bash|curl|wget)(?:\\b|%20|%09|%28)" 1;
}

# Never retain token-bearing paths or servlet URL session identifiers.
map $uri $pbl4_host_safe_uri {
    default $uri;
    "~*(?:;|%3b)jsessionid(?:=|%3d)|/(?:token|tokens|activation-token|reset-token|password-reset)/[^/]+|/(?:activate|reset-password)/[^/]+|(?:access_token|api_key|password|secret)(?:=|%3d)" "[REDACTED_PATH]";
}
map $http_user_agent $pbl4_host_safe_user_agent {
    default $http_user_agent;
    "~*(?:bearer[[:space:]]+|(?:token|password|secret|api[_-]?key)[[:space:]]*[:=]|eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+)" "[REDACTED]";
}

log_format pbl4_ai_access escape=json
    '{"schema_version":"1.0","source":"nginx_access",'
    '"timestamp":"$time_iso8601","request_id":"$request_id",'
    '"client_ip":"$remote_addr","http_method":"$request_method",'
    '"uri_path":"$pbl4_host_safe_uri","query_string":null,"status":$status,'
    '"latency_seconds":$request_time,"response_bytes":$body_bytes_sent,'
    '"request_bytes":$request_length,"user_agent":"$pbl4_host_safe_user_agent",'
    '"rule_signals":{"SQLI":$pbl4_host_sqli,"XSS":$pbl4_host_xss,'
    '"PATH_TRAVERSAL":$pbl4_host_traversal,"COMMAND_INJECTION":$pbl4_host_command}}';

